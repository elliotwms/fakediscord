name: Test
on:
  pull_request:
    branches: [ "master" ]
  workflow_call:
  merge_group:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - name: Build
      run: go build -v ./...
    - name: Test
      run: go test -v -race ./...
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        # v6 of the action only installs golangci-lint v1, which misses checks v2 runs
        uses: golangci/golangci-lint-action@v9
        with:
          # pinned so new linter releases don't fail CI unexpectedly; bump deliberately
          version: v2.5
